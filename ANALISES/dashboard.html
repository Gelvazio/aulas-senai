<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Análise do Projeto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; }
        header h1 { font-size: 32px; margin-bottom: 10px; }
        header p { opacity: 0.9; font-size: 14px; }

        .content { padding: 40px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number { font-size: 32px; font-weight: 700; margin: 10px 0; }
        .stat-label { font-size: 12px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }

        h2 { color: #667eea; font-size: 24px; margin-bottom: 20px; border-bottom: 3px solid #667eea; padding-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { background: #667eea; color: white; padding: 12px; text-align: left; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #f8f9fa; }

        .chart-container { margin-bottom: 40px; }
        .bar-chart { display: flex; align-items: flex-end; height: 200px; gap: 10px; margin-bottom: 20px; }
        .bar { flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 5px; position: relative; min-height: 20px; }
        .bar-label { position: absolute; bottom: -25px; left: 0; right: 0; text-align: center; font-size: 11px; }
        .bar-value { position: absolute; top: -20px; left: 0; right: 0; text-align: center; font-weight: 600; color: #667eea; }

        section { margin-bottom: 50px; }

        .loading { text-align: center; padding: 40px; color: #666; }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #f0f0f0; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error { background: #fee2e2; color: #991b1b; padding: 20px; border-radius: 5px; margin-bottom: 20px; }

        footer { text-align: center; padding: 20px; background: #f8f9fa; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Análise do Projeto AULAS-SENAI</h1>
            <p>Estrutura, arquivos e uso de espaço</p>
        </header>

        <div class="content" id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px;">Carregando dados...</p>
            </div>
        </div>

        <footer id="footer">
            Carregando...
        </footer>
    </div>

    <script>
        async function carregarDados() {
            const contentDiv = document.getElementById('content');
            const footerDiv = document.getElementById('footer');

            try {
                const response = await fetch('ANALISADOR.json');
                if (!response.ok) throw new Error('Erro ao carregar ANALISADOR.json');

                const dados = await response.json();
                renderizarDashboard(dados);
                footerDiv.innerHTML = `Análise realizada em ${new Date(dados.data_analise).toLocaleString('pt-BR')}`;

            } catch (error) {
                contentDiv.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
            }
        }

        function renderizarDashboard(dados) {
            const content = document.getElementById('content');
            const resumo = dados.resumo;

            let html = `
                <!-- STATS -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">📁 Pastas</div>
                        <div class="stat-number">${resumo.total_pastas}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📄 Arquivos</div>
                        <div class="stat-number">${resumo.total_arquivos}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">💾 Tamanho</div>
                        <div class="stat-number">${Math.round(resumo.tamanho_total_mb)} MB</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📊 Extensões</div>
                        <div class="stat-number">${Object.keys(resumo.extensoes).length}</div>
                    </div>
                </div>

                <!-- EXTENSÕES -->
                <section>
                    <h2>📋 Top 15 Extensões de Arquivo</h2>
                    <table>
                        <tr>
                            <th>Extensão</th>
                            <th>Quantidade</th>
                            <th>Porcentagem</th>
                        </tr>
            `;

            const extensoesOrdenadas = Object.entries(resumo.extensoes)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 15);

            extensoesOrdenadas.forEach(([ext, count]) => {
                const percentual = ((count / resumo.total_arquivos) * 100).toFixed(1);
                html += `
                    <tr>
                        <td><strong>${ext}</strong></td>
                        <td>${count}</td>
                        <td>${percentual}%</td>
                    </tr>
                `;
            });

            html += `</table></section>`;

            // TOP 15 PASTAS MAIORES
            html += `
                <section>
                    <h2>📍 Top 15 Pastas Maiores</h2>
                    <table>
                        <tr>
                            <th>Pasta</th>
                            <th>Tamanho (MB)</th>
                            <th>Arquivos</th>
                        </tr>
            `;

            dados.pastas.slice(0, 15).forEach(pasta => {
                html += `
                    <tr>
                        <td><strong>${pasta.caminho}</strong></td>
                        <td>${pasta.tamanho_total_mb} MB</td>
                        <td>${pasta.total_arquivos}</td>
                    </tr>
                `;
            });

            html += `</table></section>`;

            // GRÁFICO DE DISTRIBUIÇÃO
            html += `<section><h2>📊 Distribuição de Tamanho (Top 10)</h2>`;
            html += '<div class="chart-container"><div class="bar-chart">';

            const maxTamanho = Math.max(...dados.pastas.slice(0, 10).map(p => p.tamanho_total_mb));

            dados.pastas.slice(0, 10).forEach(pasta => {
                const altura = (pasta.tamanho_total_mb / maxTamanho) * 100;
                const nome = pasta.caminho.length > 20 ? pasta.caminho.substring(0, 20) + '...' : pasta.caminho;
                html += `
                    <div class="bar" style="height: ${altura}%">
                        <div class="bar-value">${pasta.tamanho_total_mb}</div>
                        <div class="bar-label">${nome}</div>
                    </div>
                `;
            });

            html += '</div></div></section>';

            // RESUMO GERAL
            html += `
                <section>
                    <h2>ℹ️ Informações Gerais</h2>
                    <table>
                        <tr>
                            <td><strong>Caminho do Projeto:</strong></td>
                            <td>${dados.caminho_raiz}</td>
                        </tr>
                        <tr>
                            <td><strong>Total de Pastas:</strong></td>
                            <td>${resumo.total_pastas}</td>
                        </tr>
                        <tr>
                            <td><strong>Total de Arquivos:</strong></td>
                            <td>${resumo.total_arquivos}</td>
                        </tr>
                        <tr>
                            <td><strong>Tamanho Total:</strong></td>
                            <td>${resumo.tamanho_total_mb} MB (${(resumo.tamanho_total_mb * 1024).toFixed(0)} GB)</td>
                        </tr>
                        <tr>
                            <td><strong>Tipos de Arquivo:</strong></td>
                            <td>${Object.keys(resumo.extensoes).length}</td>
                        </tr>
                    </table>
                </section>
            `;

            document.getElementById('content').innerHTML = html;
        }

        // Carregar dados ao abrir a página
        window.addEventListener('load', carregarDados);
    </script>
</body>
</html>
