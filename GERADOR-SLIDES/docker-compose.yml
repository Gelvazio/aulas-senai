version: '3.8'

services:
  web:
    build: .
    container_name: gerador-slides-web
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./SAIDA:/app/SAIDA
      - ./db.sqlite3:/app/db.sqlite3
      - ./ENTRADAS-AULAS-MARKDOWN:/app/ENTRADAS-AULAS-MARKDOWN
      - ./TASKS:/app/TASKS
    command: >
      sh -c "python manage.py migrate &&
             gunicorn gerador_config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    restart: unless-stopped
    networks:
      - gerador-net

  nginx:
    image: nginx:latest
    container_name: gerador-slides-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - gerador-net

networks:
  gerador-net:
    driver: bridge
