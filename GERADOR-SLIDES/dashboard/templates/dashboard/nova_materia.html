{% extends 'base.html' %}

{% block title %}Nova Matéria - GERADOR DE SLIDES{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">➕ Criar Nova Matéria</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label"><strong>Curso</strong></label>
                        <select class="form-select" name="curso_id" required>
                            <option value="">-- Selecione um curso --</option>
                            {% for curso in cursos %}
                                <option value="{{ curso.id }}">{{ curso.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><strong>Nome da Matéria</strong></label>
                        <input type="text" class="form-control" name="nome" required
                               placeholder="Ex: Introdução à TIC">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Carga Horária (horas)</label>
                        <input type="number" class="form-control" name="carga_horaria"
                               placeholder="Ex: 40">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" name="descricao" rows="3"
                                  placeholder="Descrição opcional da matéria"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-info btn-lg">
                            💾 Salvar Matéria
                        </button>
                        <a href="{% url 'cursos' %}" class="btn btn-secondary btn-lg">
                            ← Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
