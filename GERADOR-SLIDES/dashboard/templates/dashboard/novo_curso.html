{% extends 'base.html' %}

{% block title %}Novo Curso - GERADOR DE SLIDES{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">➕ Criar Novo Curso</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label"><strong>Nome do Curso</strong></label>
                        <input type="text" class="form-control" name="nome" required
                               placeholder="Ex: Ficha Produto Mais Tech">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" name="descricao" rows="4"
                                  placeholder="Descrição opcional do curso"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            💾 Salvar Curso
                        </button>
                        <a href="{% url 'cursos' %}" class="btn btn-secondary btn-lg">
                            ← Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
