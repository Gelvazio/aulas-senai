<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-MAIL SENAI — Redefinir senha</title>
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <main class="auth">
      <section class="auth__card">
        <h1 class="auth__logo">E-MAIL <span>SENAI</span></h1>
        <p class="auth__sub">Definir uma nova senha</p>

        <div class="aviso" id="aviso"></div>

        <!-- Estado: verificando o link -->
        <div id="verificando" class="carregando">Verificando o link…</div>

        <!-- Estado: link válido, pede a nova senha -->
        <form id="formSenha" class="oculto" autocomplete="on">
          <p class="campo__dica" style="margin-bottom: 16px">
            Definindo nova senha para <strong id="emailAlvo">…</strong>
          </p>

          <div class="campo">
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha" required minlength="6"
                   autocomplete="new-password" placeholder="mínimo 6 caracteres" />
          </div>

          <div class="campo">
            <label for="novaSenha2">Confirmar nova senha</label>
            <input type="password" id="novaSenha2" required minlength="6"
                   autocomplete="new-password" placeholder="repita a senha" />
          </div>

          <button type="submit" class="btn btn--bloco" id="btnSalvar">Salvar nova senha</button>
        </form>

        <!-- Estado: link inválido ou expirado -->
        <div id="linkInvalido" class="oculto">
          <p style="margin-bottom: 18px; color: var(--cinza-texto)">
            Este link é inválido ou já expirou. Links de redefinição valem por
            tempo limitado e só podem ser usados uma vez.
          </p>
          <a href="index.html" class="btn btn--bloco">Pedir um novo link</a>
        </div>

        <div style="text-align: center; margin-top: 16px">
          <a href="index.html" class="btn btn--link">Voltar para o login</a>
        </div>
      </section>
    </main>

    <script type="module" src="assets/js/redefinir-senha.js"></script>
  </body>
</html>
