<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Interativo - Fundamentos da Tecnologia e Programação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .view-toggle button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-toggle button.active {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .view-toggle button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* GRID VIEW */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            animation: fadeIn 0.6s ease;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        .card-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card h3 {
            color: #333;
            margin: 15px 0;
            font-size: 1.3rem;
        }

        .card-duration {
            color: #667eea;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .card-description {
            color: #666;
            font-size: 0.95rem;
            margin-top: 10px;
            line-height: 1.5;
        }

        .card-topic {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        /* DETAIL VIEW */
        .detail-view {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        .detail-view.active {
            display: block;
        }

        .detail-header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .detail-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .detail-header h2 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .detail-header .duration {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .detail-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .detail-content h3 {
            color: #667eea;
            font-size: 1.4rem;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f4ff;
            padding-bottom: 10px;
        }

        .detail-content h4 {
            color: #555;
            font-size: 1.1rem;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .detail-content p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .detail-content ul {
            color: #666;
            margin-left: 25px;
            line-height: 1.8;
        }

        .detail-content li {
            margin-bottom: 8px;
        }

        .highlight-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .example-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            background: #6c757d;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .progress-bar {
            background: #e9ecef;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        /* SEÇÃO DE MÍDIAS */
        .midias-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .midias-section h3 {
            color: #667eea;
            font-size: 1.4rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f4ff;
            padding-bottom: 10px;
        }

        .midias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .midia-card {
            background: #f8f9ff;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid #e9ecef;
        }

        .midia-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .midia-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e9ecef;
        }

        .midia-info {
            padding: 15px;
        }

        .midia-info h4 {
            color: #333;
            font-size: 0.95rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .midia-credito {
            color: #999;
            font-size: 0.85rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-card-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .video-titulo {
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .video-duracao {
            color: #667eea;
            font-size: 0.9rem;
        }

        .recursos-list {
            list-style: none;
            padding: 0;
        }

        .recurso-item {
            padding: 12px;
            background: #f8f9ff;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recurso-tipo {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-right: 10px;
            min-width: 60px;
            text-align: center;
        }

        .recurso-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .recurso-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .grid-view {
                grid-template-columns: 1fr;
            }

            .detail-content {
                padding: 20px;
            }

            .midias-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Fundamentos da Tecnologia e Programação</h1>
            <p>Rio do Sul Mais Tech - SENAI | 33 horas</p>

        <div class="view-toggle">

        <div id="detailView" class="detail-view">

                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="detail-header">
                <div class="detail-icon" id="detailIcon"></div>
                <h2 id="detailTitle"></h2>
                <div class="duration" id="detailDuration"></div>

            </div>

            <div class="detail-content" id="detailContent"></div>

            <!-- SEÇÃO DE MÍDIAS -->
            <div id="midiasSection" class="midias-section" style="display: none;">

                <div style="margin-bottom: 30px;">
                    <h4 style="color: #667eea; margin-bottom: 15px;">🖼️ Imagens Relacionadas</h4>

                <div style="margin-bottom: 30px;">

                    <div id="videosContainer"></div>
                </div>

                <!-- RECURSOS -->
                <div>
                    <h4 style="color: #667eea; margin-bottom: 15px;">🔗 Recursos Adicionais</h4>
                    <ul class="recursos-list" id="recursosList"></ul>
                </div>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-back" id="prevBtn" onclick="previousAula()">← Anterior</button>
                <button class="btn" id="nextBtn" onclick="nextAula()">Próxima →</button>
            </div>
        </div>
    </div>

    <script>
        // DADOS DAS AULAS
        const aulas = [
            {
                numero: 1,
                titulo: "Tecnologia e Dispositivos Digitais",
                duracao: "2h",
                bloco: "Bloco 1: Tecnologia e Mundo Digital",
                icon: "💻",
                descricao: "O que é tecnologia, dispositivos no cotidiano, evolução dos computadores",
                topicos: ["Tecnologia", "Hardware/Software", "Evolução"],
                conteudo: `
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        <li>Definir o conceito de tecnologia</li>
                        <li>Identificar dispositivos digitais no cotidiano</li>
                        <li>Compreender a evolução histórica dos computadores</li>
                        <li>Reconhecer código binário (0s e 1s)</li>
                    </ul>

                    <h3>📖 Conteúdo Principal</h3>

                    <h4>O que é Tecnologia?</h4>
                    <p>Aplicação prática de conhecimentos científicos para criar ferramentas, máquinas e sistemas que resolvem problemas humanos.</p>

                    <div class="example-box">
                        Exemplos: Smartphone, automóvel, fogão, geladeira, internet
                    </div>

                    <h4>Evolução dos Computadores (4 Gerações)</h4>
                    <ul>
                        <li><strong>1ª Geração (1940s-1950s):</strong> Válvulas eletrônicas - ocupavam salas inteiras</li>
                        <li><strong>2ª Geração (1950s-1960s):</strong> Transistores - máquinas menores</li>
                        <li><strong>3ª Geração (1960s-1970s):</strong> Circuitos integrados - processamento melhorado</li>
                        <li><strong>4ª Geração (1980s-presente):</strong> Microprocessadores - computadores portáteis</li>
                    </ul>

                    <h4>Código Binário (0s e 1s)</h4>
                    <p>Toda a informação no computador é armazenada usando apenas dois dígitos: 0 (desligado) e 1 (ligado).</p>

                    <div class="highlight-box">
                        <strong>Curiosidade:</strong> Seu smartphone atual é MILHARES DE VEZES mais potente que o computador que levou o homem à Lua em 1969!
                    </div>

                    <h3>🎬 Atividades Práticas</h3>
                    <ul>
                        <li>Timeline da Tecnologia (desenhar história dos computadores)</li>
                        <li>Exercício "Um Dia Sem Tecnologia" (reflexão)</li>
                        <li>Identificar dispositivos digitais do cotidiano</li>
                    </ul>
                `
            },
            {
                numero: 2,
                titulo: "Cidadania Digital e Segurança",
                duracao: "2h",
                bloco: "Bloco 1: Tecnologia e Mundo Digital",
                icon: "🛡️",
                descricao: "Cidadania digital, fake news, cyberbullying, pegada digital e privacidade",
                topicos: ["Segurança", "Privacidade", "Ética Digital"],
                conteudo: `
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        <li>Entender cidadania digital</li>
                        <li>Identificar riscos online</li>
                        <li>Reconhecer e combater fake news</li>
                        <li>Proteger dados pessoais</li>
                    </ul>

                    <h3>📖 Conteúdo Principal</h3>

                    <h4>Cidadania Digital</h4>
                    <p>Conjunto de normas, direitos e responsabilidades ao usar internet e tecnologia.</p>

                    <h4>Fake News - Como Identificar?</h4>
                    <div class="highlight-box">
                        <strong>❌ Sinais de alerta:</strong>
                        <ul style="margin-top: 10px;">
                            <li>Título sensacionalista demais</li>
                            <li>Sem fonte identificada</li>
                            <li>Falta de data ou contexto</li>
                            <li>Imagem fora de contexto</li>
                        </ul>
                    </div>

                    <h4>Cyberbullying</h4>
                    <p>Assédio, humilhação ou ameaça via internet. Impactos: depressão, isolamento social, queda no desempenho.</p>

                    <div class="example-box">
                        <strong>O que fazer:</strong> Bloquear agressor, guardar provas, denunciar, conversar com pais/professores
                    </div>

                    <h3>🎬 Atividades Práticas</h3>
                    <ul>
                        <li>Caçada de Fake News (investigar notícias falsas)</li>
                        <li>Análise de Pegada Digital (pesquisar seu próprio nome)</li>
                        <li>Criar Guia de Segurança para amigos</li>
                    </ul>
                `
            },
            {
                numero: 3,
                titulo: "Hardware vs Software",
                duracao: "2h",
                bloco: "Bloco 2: Hardware, Software e SO",
                icon: "⚙️",
                descricao: "Diferença entre hardware e software, componentes de PC",
                topicos: ["Hardware", "Software", "Componentes"],
                conteudo: `
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        <li>Diferenciar hardware de software</li>
                        <li>Identificar componentes físicos</li>
                        <li>Compreender trabalho integrado</li>
                    </ul>

                    <h3>📖 Conteúdo Principal</h3>

                    <h4>Hardware (Partes Físicas)</h4>
                    <p>Componentes que você pode tocar: processador, memória, disco rígido, monitor, teclado, mouse, impressora.</p>

                    <div class="highlight-box">
                        <strong>Analogia:</strong> Hardware é como o corpo humano - coração, pulmões, braços, pernas
                    </div>

                    <h4>Software (Programas Digitais)</h4>
                    <p>Conjunto de instruções que dizem ao hardware o que fazer. Exemplos: Windows, Word, Excel, Chrome, WhatsApp.</p>

                    <div class="highlight-box">
                        <strong>Analogia:</strong> Software é como a mente - pensa, toma decisões, controla o corpo
                    </div>

                    <h4>Hardware + Software = Computador Funcionando</h4>
                    <p>Sem hardware, não há lugar para software. Sem software, hardware é inútil.</p>

                    <h3>🎬 Atividades Práticas</h3>
                    <ul>
                        <li>Dissecação de Computador (mostrar componentes internos)</li>
                        <li>Inventário de Hardware e Software</li>
                        <li>Diagrama Hardware-Software</li>
                    </ul>
                `
            },
            {
                numero: 4,
                titulo: "Sistema Operacional",
                duracao: "2h",
                bloco: "Bloco 2: Hardware, Software e SO",
                icon: "📁",
                descricao: "Interface, gerenciamento de arquivos e pastas, atalhos",
                topicos: ["SO", "Arquivos", "Navegação"],
                conteudo: `
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        <li>Dominar gerenciamento de arquivos</li>
                        <li>Usar atalhos eficientemente</li>
                        <li>Navegar em estrutura de pastas</li>
                    </ul>

                    <h3>📖 Conteúdo Principal</h3>

                    <h4>Componentes da Interface</h4>
                    <ul>
                        <li><strong>Desktop:</strong> Fundo com ícones</li>
                        <li><strong>Taskbar:</strong> Barra com programas abertos</li>
                        <li><strong>Menu Iniciar:</strong> Acesso a programas</li>
                        <li><strong>Painel de Controle:</strong> Configurações do sistema</li>
                    </ul>

                    <h4>Arquivos e Pastas</h4>
                    <p>Arquivo = documento, imagem, programa. Pasta = recipiente que organiza arquivos em hierarquia.</p>

                    <div class="example-box">
                        Exemplo de estrutura:
                        <br>C:/ (Disco)
                        <br>├── Documentos/
                        <br>│   ├── Trabalhos/
                        <br>│   └── Fotos/
                        <br>└── Programas/
                    </div>

                    <h4>Operações Básicas</h4>
                    <ul>
                        <li><strong>Ctrl+C:</strong> Copiar</li>
                        <li><strong>Ctrl+V:</strong> Colar</li>
                        <li><strong>Ctrl+X:</strong> Recortar</li>
                        <li><strong>Ctrl+Z:</strong> Desfazer</li>
                        <li><strong>Delete:</strong> Deletar</li>
                    </ul>

                    <h3>🎬 Atividades Práticas</h3>
                    <ul>
                        <li>Organizar Pasta de Documentos</li>
                        <li>Jogos de Atalhos (competição de velocidade)</li>
                        <li>Limpeza de Lixeira</li>
                    </ul>
                `
            },
            {
                numero: 5,
                titulo: "Editores de Texto",
                duracao: "2h",
                bloco: "Bloco 3: Produtividade Digital",
                icon: "📝",
                descricao: "Google Docs, Word, formatação, documentos profissionais",
                topicos: ["Texto", "Formatação", "Produtividade"],
                conteudo: `
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        <li>Dominar formatação de texto</li>
                        <li>Criar documentos profissionais</li>
                        <li>Usar estilos e templates</li>
                    </ul>

                    <h3>📖 Conteúdo Principal</h3>

                    <h4>Tipos de Editores</h4>
                    <ul>
                        <li><strong>Google Docs:</strong> Gratuito, online, colaborativo</li>
                        <li><strong>Microsoft Word:</strong> Profissional, completo</li>
                        <li><strong>LibreOffice:</strong> Grátis, open-source</li>
                    </ul>

                    <h4>Formatação Básica</h4>
                    <div class="highlight-box">
                        <strong>Negrito (Ctrl+B)</strong>
                        <br><em>Itálico (Ctrl+I)</em>
                        <br><u>Sublinhado (Ctrl+U)</u>
                        <br>Cores, tamanho de fonte, alinhamento

                        <li>Testar e ajustar (15 min)</li>
                        <li>Documentar (10 min)</li>
                    </ol>

                    <h3>🎬 Atividades Práticas</h3>
                    <ul>
                        <li>Desenvolvimento do Projeto Criativo (80 min)</li>
                        <li>Apresentação para Turma (4-5 min por projeto)</li>
                        <li>Feedback dos colegas</li>
                    </ul>

                    <h3>📊 Avaliação Final</h3>
                    <div class="highlight-box">
                        <strong>Criatividade:</strong> 2.0 pontos
                        <br><strong>Funcionalidade:</strong> 2.0 pontos
                        <br><strong>Uso de Blocos:</strong> 1.5 pontos
                        <br><strong>Design Visual:</strong> 1.5 pontos
                        <br><strong>Documentação:</strong> 1.0 ponto
                        <br><strong>Apresentação:</strong> 1.0 ponto
                        <br><strong>TOTAL: 9.0 pontos</strong>
                    </div>
                `
            }
        ];

        // RENDERIZAR GRID
        function renderGrid() {
            const gridView = document.getElementById('gridView');
            gridView.innerHTML = '';

            aulas.forEach((aula, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showDetail(index);

                const ícones = ['💻', '🛡️', '⚙️', '📁', '📝', '🎨', '📊', '🌐', '🔐', '🧠', '⛓️', '📐', '💻', '🎮', '🕹️', '⭐'];
                const iconemojia = ícones[index] || '📚';

                card.innerHTML = `
                    <div class="card-number">${String(aula.numero).padStart(2, '0')}</div>
                    <div class="card-icon">${iconemojia}</div>
                    <h3>${aula.titulo}</h3>
                    <div class="card-duration">⏱️ ${aula.duracao}</div>
                    <p class="card-description">${aula.descricao}</p>
                    <div class="card-topic">${aula.bloco.split(':')[1]?.trim() || 'Tecnologia'}</div>
                `;
                gridView.appendChild(card);
            });
        }

        // MOSTRAR GRID
        function showGrid() {
            document.getElementById('gridView').style.display = 'grid';
            document.getElementById('detailView').classList.remove('active');
            document.querySelectorAll('.view-toggle button')[0].classList.add('active');
            document.querySelectorAll('.view-toggle button')[1].classList.remove('active');
        }

        // MOSTRAR DETALHES
        function showDetail(index = 0) {
            currentAulaIndex = index;
            const aula = aulas[index];

            document.getElementById('gridView').style.display = 'none';
            document.getElementById('detailView').classList.add('active');
            document.querySelectorAll('.view-toggle button')[0].classList.remove('active');
            document.querySelectorAll('.view-toggle button')[1].classList.add('active');

            const ícones = ['💻', '🛡️', '⚙️', '📁', '📝', '🎨', '📊', '🌐', '🔐', '🧠', '⛓️', '📐', '💻', '🎮', '🕹️', '⭐'];
            const icon = ícones[index] || '📚';

            document.getElementById('detailIcon').textContent = icon;
            document.getElementById('detailTitle').textContent = `AULA ${String(aula.numero).padStart(2, '0')} — ${aula.titulo}`;
            document.getElementById('detailDuration').textContent = `⏱️ ${aula.duracao}`;
            document.getElementById('detailBloco').textContent = aula.bloco;
            document.getElementById('detailContent').innerHTML = aula.conteudo;

            // Atualizar progresso
            const progress = ((index + 1) / aulas.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Habilitar/desabilitar botões
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === aulas.length - 1;

            // Atualizar textos dos botões
            if (index === aulas.length - 1) {
                document.getElementById('nextBtn').textContent = '✓ Finalizado';
            } else {
                document.getElementById('nextBtn').textContent = `Próxima (${aulas[index+1].numero}) →`;
            }

            if (index > 0) {
                document.getElementById('prevBtn').textContent = `← Anterior (${aulas[index-1].numero})`;
            }

            // TODO: Carregar mídias quando MIDIAS.js estiver disponível
            // renderizarMidias(aula.numero);
        }

        // NAVEGAÇÃO
        let currentAulaIndex = 0;

        function previousAula() {
            if (currentAulaIndex > 0) {
                showDetail(currentAulaIndex - 1);
            }
        }

        function nextAula() {
            if (currentAulaIndex < aulas.length - 1) {
                showDetail(currentAulaIndex + 1);
            }
        }

        // FUNÇÃO: Renderizar Mídias
        function renderizarMidias(numeroAula) {
            // Obter mídias da aula
            const aulaKey = `aula_${String(numeroAula).padStart(2, '0')}`;
            console.log(`Buscando mídias para: ${aulaKey}`);

            // Verificar se MIDIAS está disponível
            if (typeof window.MIDIAS === 'undefined' || !window.MIDIAS) {
                console.error('MIDIAS não foi carregado!');
                console.log('Tentando acessar MIDIAS novamente...');
                // Retry
                setTimeout(() => renderizarMidias(numeroAula), 500);
                return;
            }

            const midias = window.MIDIAS[aulaKey];

            if (!midias) {
                console.warn(`Nenhuma mídia encontrada para ${aulaKey}`);
                document.getElementById('midiasSection').style.display = 'none';
                return;
            }

            console.log(`Mídias encontradas para ${aulaKey}:`, midias);
            document.getElementById('midiasSection').style.display = 'block';

            // RENDERIZAR IMAGENS
            const imagensGrid = document.getElementById('imagensGrid');
            imagensGrid.innerHTML = '';

            console.log(`Imagens disponíveis: ${midias.imagens ? midias.imagens.length : 0}`);

            if (midias.imagens && midias.imagens.length > 0) {
                midias.imagens.forEach((img, idx) => {
                    console.log(`  Imagem ${idx + 1}: ${img.titulo}`);
                    const card = document.createElement('div');
                    card.className = 'midia-card';
                    card.innerHTML = `
                        <img src="${img.url}" alt="${img.titulo}" class="midia-image" onerror="this.src='https://via.placeholder.com/250x180?text=Imagem'">
                        <div class="midia-info">
                            <h4>${img.titulo}</h4>
                            <div class="midia-credito">Crédito: ${img.credito}</div>
                        </div>
                    `;
                    imagensGrid.appendChild(card);
                });
            } else {
                console.warn('Nenhuma imagem encontrada para esta aula');
            }

            // RENDERIZAR VÍDEOS
            const videosContainer = document.getElementById('videosContainer');
            videosContainer.innerHTML = '';

            console.log(`Vídeos disponíveis: ${midias.videos ? midias.videos.length : 0}`);

            if (midias.videos && midias.videos.length > 0) {
                midias.videos.forEach((video, index) => {
                    console.log(`  Vídeo ${index + 1}: ${video.titulo}`);
                    const videoWrapper = document.createElement('div');
                    videoWrapper.innerHTML = `
                        <div class="video-card-info">
                            <div class="video-titulo">▶️ ${video.titulo}</div>
                            <div class="video-duracao">⏱️ ${video.duracao}</div>
                        </div>
                        <div class="video-container">
                            <iframe src="${video.url}" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    `;
                    videosContainer.appendChild(videoWrapper);
                });
            } else {
                console.warn('Nenhum vídeo encontrado para esta aula');
            }

            // RENDERIZAR RECURSOS
            const recursosList = document.getElementById('recursosList');
            recursosList.innerHTML = '';

            console.log(`Recursos disponíveis: ${midias.recursos ? midias.recursos.length : 0}`);

            if (midias.recursos && midias.recursos.length > 0) {
                midias.recursos.forEach((recurso, idx) => {
                    console.log(`  Recurso ${idx + 1}: ${recurso.titulo}`);
                    const item = document.createElement('li');
                    item.className = 'recurso-item';
                    item.innerHTML = `
                        <div style="flex: 1;">
                            <span class="recurso-tipo">${recurso.tipo.toUpperCase()}</span>
                            <span>${recurso.titulo}</span>
                        </div>
                        <a href="${recurso.url}" target="_blank" class="recurso-link">Acessar →</a>
                    `;
                    recursosList.appendChild(item);
                });
            } else {
                console.warn('Nenhum recurso encontrado para esta aula');
            }
        }

        // INICIALIZAR
        renderGrid();
    </script>
</body>
</html>
