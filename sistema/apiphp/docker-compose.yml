version: '3.8'

services:
  # Servidor PHP com Apache
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senai-api-php
    ports:
      - "8080:80"
    volumes:
      # Monta o código para desenvolvimento (hot-reload)
      - .:/var/www/html
    environment:
      - TIMEZONE=America/Maceio
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=300
    networks:
      - senai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # (Opcional) PostgreSQL para banco de dados
  postgres:
    image: postgres:15-alpine
    container_name: senai-postgres
    environment:
      POSTGRES_USER: senai_user
      POSTGRES_PASSWORD: senai_password_dev
      POSTGRES_DB: senai_db
      POSTGRES_INITDB_ARGS: "-c timezone=America/Maceio"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - senai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senai_user -d senai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  senai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
