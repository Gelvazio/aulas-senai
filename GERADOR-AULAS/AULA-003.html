<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 003 - Slide Teste</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #004384 0%, #0055b3 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .slide {
            background: white;
            color: #333;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            text-align: center;
        }
        h1 {
            color: #004384;
            font-size: 2.5em;
            margin: 0;
        }
        p {
            font-size: 1.2em;
            color: #666;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="slide">
        <h1>📊 AULA 003</h1>
        <p><strong>Terceiro Slide de Teste</strong></p>
        <p>Demonstrando a contagem automática de slides no dashboard.</p>
        <small>Sistema funcionando corretamente</small>
    </div>
</body>
</html>
