services:
  rustdesk:
    # Build a partir do Dockerfile local
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rustdesk-server
    image: rustdesk-server:latest

    # Restart automático
    restart: unless-stopped

    # Portas
    ports:
      - "21115:21115/tcp"   # hbbs
      - "21117:21117/tcp"   # hbbr
      - "21119:21119/tcp"   # hbbr
      - "21119:21119/udp"   # hbbr

    # Volumes
    volumes:
      - rustdesk-data:/root

    # Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  rustdesk-data:
    driver: local
