services:
  rustdesk:
    # Usar imagem nginx como base para simular servidor
    image: nginx:alpine

    container_name: rustdesk-server
    restart: unless-stopped

    # Expor portas do RustDesk
    ports:
      - "21115:80"    # hbbs redireciona para 80 (nginx)
      - "21117:8080"  # hbbr
      - "21119:9000"  # hbbr UDP
      - "21119:9000/udp"

    # Volumes
    volumes:
      - rustdesk-data:/data
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    # Health check
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  rustdesk-data:
    driver: local
