  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      background: #004384;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header h1 {
      color: #004384;
      font-size: 28px;
      margin-bottom: 5px;
      font-weight: 700;
    }
    .login-header p {
      color: #666;
      font-size: 13px;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 13px;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: border .2s, box-shadow .2s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #004384;
      box-shadow: 0 0 0 3px rgba(0,67,132,0.1);
    }
    .hidden {
      display: none !important;
    }
    .btn-login {
      width: 100%;
      padding: 12px 16px;
      background: #004384;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #003366;
    }
    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
    .msg.error {
      background: #fce4ec;
      color: #c62828;
    }
    .msg.success {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-login.loading {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-login.loading .spinner {
      display: block;
    }
    .info {
      background: #f0f7ff;
      border-left: 3px solid #004384;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #333;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🎓 SENAI</h1>
      <p>Sistema de Gestão de Aulas</p>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button type="button" id="btnTelaLogin" onclick="mostrarTelaLogin()" style="flex:1;padding:10px;background:#004384;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer">🔐 Login</button>
      <button type="button" id="btnTelaCadastro" onclick="mostrarTelaCadastro()" style="flex:1;padding:10px;background:#f7941d;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer">📝 Cadastro</button>
    </div>

    <!-- TELA DE LOGIN -->
    <form id="loginForm" onsubmit="fazerLogin(event)">
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="seu.email@senai.br" />
      </div>

      <div class="form-group">
        <label for="senha">Senha *</label>
        <input type="password" id="senha" placeholder="Digite sua senha" />
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="spinner"></span>
        Entrar
      </button>
      <div style="text-align:center;margin-top:15px">
        <button type="button" onclick="abrirModalResetSenha()" style="background:none;border:none;color:#004384;cursor:pointer;font-weight:600;text-decoration:underline;font-size:13px">
          🔐 Esqueceu a senha?
        </button>
      </div>
    </form>

    <!-- TELA DE CADASTRO -->
    <form id="cadastroForm" onsubmit="fazerCadastro(event)" style="display:none">
      <div class="form-group">
        <label for="cadastroNome">Nome Completo *</label>
        <input type="text" id="cadastroNome" placeholder="Seu nome completo" />
      </div>

      <div class="form-group">
        <label for="cadastroEmail">Email *</label>
        <input type="email" id="cadastroEmail" placeholder="seu.email@senai.br" />
      </div>

      <div class="form-group">
        <label for="cadastroSenha">Senha *</label>
        <input type="password" id="cadastroSenha" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-group">
        <label for="cadastroConfirmaSenha">Confirmar Senha *</label>
        <input type="password" id="cadastroConfirmaSenha" placeholder="Repita sua senha" />
      </div>

      <div class="info">ℹ️ Você será cadastrado como <strong>ALUNO</strong>. Professores devem solicitar cadastro ao administrador.</div>

      <button type="submit" class="btn-login" id="btnCadastro">
        <span class="spinner"></span>
        Criar Conta
      </button>
    </form>

    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- MODAL: RESET DE SENHA -->
  <div id="modalResetSenha" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
    <div style="background:white;border-radius:12px;padding:30px;width:90%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.15)">
      <h2 style="color:#004384;margin-top:0;text-align:center">🔐 Resetar Senha</h2>

      <form onsubmit="resetarSenha(event)">
        <div class="form-group">
          <label for="resetEmail">Email *</label>
          <input type="email" id="resetEmail" placeholder="seu.email@senai.br" required />
        </div>

        <div class="form-group">
          <label for="resetCodigo">Código de Acesso *</label>
          <input type="text" id="resetCodigo" placeholder="Digite o código fornecido pelo professor" required />
        </div>

        <div class="form-group">
          <label for="resetSenhaNova">Nova Senha *</label>
          <input type="password" id="resetSenhaNova" placeholder="Mínimo 6 caracteres" required />
        </div>

        <div class="form-group">
          <label for="resetSenhaConfirma">Confirmar Senha *</label>
          <input type="password" id="resetSenhaConfirma" placeholder="Repita a nova senha" required />
        </div>

        <div style="display:flex;gap:10px">
          <button type="submit" class="btn-login" style="flex:1">✅ Resetar</button>
          <button type="button" onclick="fecharModalResetSenha()" class="btn-login" style="flex:1;background:#999">❌ Cancelar</button>
        </div>

        <div class="msg" id="resetMsg" style="margin-top:15px;display:none"></div>
      </form>
    </div>
  </div>

  <script>
    // ── Configuração e Funções Supabase ───────────────────
    const SUPABASE = {
      URL: "https://hxlvonriearllcmfqeri.supabase.co",
      KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4bHZvbnJpZWFybGxjbWZxZXJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDU1OTQsImV4cCI6MjEwNDIyMTU5NH0.v20Rm-ejMMnCNpxUkz5Ege4NaAPGf_nIv5dNkiBtZAk"
    };

    function sbH() {
      const headers = {
        apikey: SUPABASE.KEY,
        Authorization: "Bearer " + SUPABASE.KEY,
        "Content-Type": "application/json",
      };
      const usuarioEmail = sessionStorage.getItem("usuarioEmail");
      if (usuarioEmail) {
        headers["X-User-Email"] = usuarioEmail;
      }
      return headers;
    }

    async function sbGet(table, qs = "") {
      const r = await fetch(`${SUPABASE.URL}/rest/v1/${table}?${qs}`, {
        headers: sbH(),
      });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function sbPost(table, body) {
      const url = `${SUPABASE.URL}/rest/v1/${table}`;
      const headers = { ...sbH(), Prefer: "return=representation" };
      const bodyStr = JSON.stringify(body);

      console.log("📤 sbPost DEBUG:", { table, url, headers, body, bodyStr });

      const r = await fetch(url, {
        method: "POST",
        headers: headers,
        body: bodyStr,
      });

      const responseText = await r.text();
      console.log("📥 sbPost RESPONSE:", { status: r.status, ok: r.ok, response: responseText });

      if (!r.ok) {
        const errorMsg = `Erro ${r.status}: ${responseText}`;
        console.error("❌ sbPost ERROR:", errorMsg);
        throw new Error(errorMsg);
      }

      return JSON.parse(responseText);
    }

    async function sbPatch(table, pk, pkVal, body) {
      const r = await fetch(`${SUPABASE.URL}/rest/v1/${table}?${pk}=eq.${pkVal}`, {
        method: "PATCH",
        headers: { ...sbH(), Prefer: "return=representation" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function sbDelete(table, qs) {
      const r = await fetch(`${SUPABASE.URL}/rest/v1/${table}?${qs}`, {
        method: "DELETE",
        headers: sbH(),
      });
      if (!r.ok) throw new Error(await r.text());
    }
  </script>

  <script>
    function mostrarTelaLogin() {
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("cadastroForm").style.display = "none";
      document.getElementById("btnTelaLogin").style.background = "#004384";
      document.getElementById("btnTelaCadastro").style.background = "#f7941d";
      document.getElementById("loginMsg").style.display = "none";
    }

    function mostrarTelaCadastro() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("cadastroForm").style.display = "block";
      document.getElementById("btnTelaLogin").style.background = "#f0f0f0";
      document.getElementById("btnTelaCadastro").style.background = "#f7941d";
      document.getElementById("loginMsg").style.display = "none";
    }

    async function fazerLogin(e) {
      e.preventDefault();

      const btnLogin = document.getElementById("btnLogin");
      const msgEl = document.getElementById("loginMsg");
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      btnLogin.disabled = true;
      msgEl.style.display = "none";

      try {
        if (!email || !senha) {
          mostrarMsg("Email e senha são obrigatórios", true);
          btnLogin.disabled = false;
          return;
        }

        // Calcular SHA-256 da senha
        const hashSenha = await calcularSHA256(senha);

        // Buscar usuário no banco por email (aluno ou professor)
        const usuarios = await sbGet("usuario", `email=eq.${encodeURIComponent(email)}&select=*`);

        if (!usuarios || usuarios.length === 0) {
          mostrarMsg("Email ou senha incorretos", true);
          btnLogin.disabled = false;
          return;
        }

        const usuarioBD = usuarios[0];

        // Validar senha
        if (usuarioBD.senha_hash !== hashSenha) {
          mostrarMsg("Email ou senha incorretos", true);
          btnLogin.disabled = false;
          return;
        }

        // Salvar dados de sessão em sessionStorage (válido para aluno ou professor)
        sessionStorage.setItem("usuarioId", usuarioBD.id);
        sessionStorage.setItem("usuarioLogin", usuarioBD.login_usuario);
        sessionStorage.setItem("usuarioPerfil", usuarioBD.perfil); // ALUNO ou PROFESSOR
        sessionStorage.setItem("usuarioNome", usuarioBD.nome || usuarioBD.login_usuario);
        sessionStorage.setItem("usuarioEmail", email);
        sessionStorage.setItem("usuarioTimestamp", Date.now());

        mostrarMsg("✅ Login realizado com sucesso!", false);
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } catch (erro) {
        console.error("❌ Erro ao fazer login:", erro);
        mostrarMsg("❌ Erro: " + erro.message, true);
        btnLogin.disabled = false;
      }
    }

    async function fazerCadastro(e) {
      e.preventDefault();

      const btnCadastro = document.getElementById("btnCadastro");
      const msgEl = document.getElementById("loginMsg");
      const nome = document.getElementById("cadastroNome").value.trim();
      const email = document.getElementById("cadastroEmail").value.trim();
      const senha = document.getElementById("cadastroSenha").value.trim();
      const confirmaSenha = document.getElementById("cadastroConfirmaSenha").value.trim();

      btnCadastro.disabled = true;
      msgEl.style.display = "none";

      try {
        if (!nome || !email || !senha || !confirmaSenha) {
          mostrarMsg("Todos os campos são obrigatórios", true);
          btnCadastro.disabled = false;
          return;
        }

        if (senha.length < 6) {
          mostrarMsg("Senha deve ter no mínimo 6 caracteres", true);
          btnCadastro.disabled = false;
          return;
        }

        if (senha !== confirmaSenha) {
          mostrarMsg("As senhas não correspondem", true);
          btnCadastro.disabled = false;
          return;
        }

        // Verificar se email já existe
        const usuariosExistentes = await sbGet("usuario", `email=eq.${encodeURIComponent(email)}`);
        if (usuariosExistentes && usuariosExistentes.length > 0) {
          mostrarMsg("Este email já está registrado", true);
          btnCadastro.disabled = false;
          return;
        }

        // 🎯 Criar registro em tabela 'usuario' (sem ID - auto-increment)
        const novoUsuario = {
          login_usuario: email.split("@")[0],
          nome_completo: nome,
          email: email,
          perfil: "ALUNO"
        };

        const resultado = await sbPost("usuario", novoUsuario);

        // resultado é um array, pegar o primeiro elemento
        const usuario = Array.isArray(resultado) ? resultado[0] : resultado;

        if (usuario && usuario.id) {
          mostrarMsg("✅ Conta criada com sucesso! Redirecionando...", false);

          // Salvar dados de sessão
          sessionStorage.setItem("usuarioId", usuario.id);
          sessionStorage.setItem("usuarioLogin", usuario.login_usuario);
          sessionStorage.setItem("usuarioPerfil", "ALUNO");
          sessionStorage.setItem("usuarioNome", usuario.nome_completo);
          sessionStorage.setItem("usuarioEmail", email);
          sessionStorage.setItem("usuarioTimestamp", Date.now());

          // Redirecionar após 2 segundos
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 2000);
        } else {
          mostrarMsg("Erro ao criar conta", true);
          btnCadastro.disabled = false;
        }
      } catch (erro) {
        console.error("❌ Erro ao fazer cadastro:", erro);
        mostrarMsg("❌ Erro: " + erro.message, true);
        btnCadastro.disabled = false;
      }
    }

    function mostrarMsg(msg, erro) {
      const msgEl = document.getElementById("loginMsg");
      msgEl.textContent = msg;
      msgEl.className = "msg " + (erro ? "error" : "success");
      msgEl.style.display = "block";
    }

    async function calcularSHA256(texto) {
      const encoder = new TextEncoder();
      const dados = encoder.encode(texto);
      const hashBuffer = await crypto.subtle.digest("SHA-256", dados);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      return hashHex;
    }

    // 🔐 FUNÇÕES DE RESET DE SENHA
    function abrirModalResetSenha() {
      document.getElementById("modalResetSenha").style.display = "flex";
      document.getElementById("resetEmail").focus();
    }

    function fecharModalResetSenha() {
      document.getElementById("modalResetSenha").style.display = "none";
      document.getElementById("resetEmail").value = "";
      document.getElementById("resetCodigo").value = "";
      document.getElementById("resetSenhaNova").value = "";
      document.getElementById("resetSenhaConfirma").value = "";
      document.getElementById("resetMsg").style.display = "none";
    }

    function gerarNumero(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    async function resetarSenha(e) {
      e.preventDefault();

      const email = document.getElementById("resetEmail").value.trim();
      const codigo = document.getElementById("resetCodigo").value.trim();
      const senhaNova = document.getElementById("resetSenhaNova").value.trim();
      const senhaConfirma = document.getElementById("resetSenhaConfirma").value.trim();
      const msgEl = document.getElementById("resetMsg");

      msgEl.style.display = "none";

      // Validações
      if (!email || !codigo || !senhaNova || !senhaConfirma) {
        msgEl.textContent = "❌ Todos os campos são obrigatórios";
        msgEl.className = "msg error";
        msgEl.style.display = "block";
        return;
      }

      if (senhaNova.length < 6) {
        msgEl.textContent = "❌ Senha deve ter no mínimo 6 caracteres";
        msgEl.className = "msg error";
        msgEl.style.display = "block";
        return;
      }

      if (senhaNova !== senhaConfirma) {
        msgEl.textContent = "❌ As senhas não correspondem";
        msgEl.className = "msg error";
        msgEl.style.display = "block";
        return;
      }

      try {
        // Buscar usuário por email
        const usuarios = await sbGet("usuario", `email=eq.${encodeURIComponent(email)}`);
        if (!usuarios || usuarios.length === 0) {
          msgEl.textContent = "❌ Email não encontrado";
          msgEl.className = "msg error";
          msgEl.style.display = "block";
          return;
        }

        const usuario = usuarios[0];

        // Validar código de acesso
        if (!usuario.codigoacesso || usuario.codigoacesso !== codigo) {
          msgEl.textContent = "❌ Código de acesso incorreto";
          msgEl.className = "msg error";
          msgEl.style.display = "block";
          return;
        }

        const usuarioId = usuario.id;
        const hashNova = await calcularSHA256(senhaNova);

        // Atualizar senha no banco e limpar código de acesso
        await sbPatch("usuario", "id", usuarioId, {
          senha_hash: hashNova,
          codigoacesso: null
        });

        msgEl.textContent = "✅ Senha resetada com sucesso! Redirecionando...";
        msgEl.className = "msg success";
        msgEl.style.display = "block";

        setTimeout(() => {
          fecharModalResetSenha();
          document.getElementById("email").value = email;
          document.getElementById("loginMsg").textContent = "✅ Você pode fazer login com sua nova senha";
          document.getElementById("loginMsg").className = "msg success";
          document.getElementById("loginMsg").style.display = "block";
        }, 2000);
      } catch (erro) {
        console.error("❌ Erro ao resetar senha:", erro);
        msgEl.textContent = "❌ Erro: " + erro.message;
        msgEl.className = "msg error";
        msgEl.style.display = "block";
      }
    }
  </script>
</body>
