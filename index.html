<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — SENAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      background: #004384;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header h1 {
      color: #004384;
      font-size: 28px;
      margin-bottom: 5px;
      font-weight: 700;
    }
    .login-header p {
      color: #666;
      font-size: 13px;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 13px;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: border .2s, box-shadow .2s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #004384;
      box-shadow: 0 0 0 3px rgba(0,67,132,0.1);
    }
    .hidden {
      display: none !important;
    }
    .btn-login {
      width: 100%;
      padding: 12px 16px;
      background: #004384;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #003366;
    }
    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
    .msg.error {
      background: #fce4ec;
      color: #c62828;
    }
    .msg.success {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-login.loading {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-login.loading .spinner {
      display: block;
    }
    .info {
      background: #f0f7ff;
      border-left: 3px solid #004384;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #333;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🎓 SENAI</h1>
      <p>Sistema de Gestão de Aulas</p>
    </div>

    <form id="loginForm" onsubmit="fazerLogin(event)">
      <div class="form-group">
        <label for="perfil">Perfil de Acesso *</label>
        <select id="perfil" disabled>
          <option value="ALUNO">👨‍🎓 Aluno</option>
          <option value="PROFESSOR">👨‍🏫 Professor</option>
        </select>
        <div class="info">ℹ️ Seu perfil é detectado automaticamente baseado no seu email registrado no banco de dados</div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="seu.email@senai.br" />
      </div>

      <div class="form-group">
        <label for="senha">Senha *</label>
        <input type="password" id="senha" placeholder="Digite sua senha" />
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="spinner"></span>
        Entrar
      </button>
    </form>

    <div class="msg" id="loginMsg"></div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>

  <script>
    // Função removida: perfil agora é detectado automaticamente pelo email

    async function fazerLogin(e) {
      e.preventDefault();

      const btnLogin = document.getElementById("btnLogin");
      const msgEl = document.getElementById("loginMsg");
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      btnLogin.disabled = true;
      msgEl.style.display = "none";

      try {
        if (!email || !senha) {
          mostrarMsg("Email e senha são obrigatórios", true);
          btnLogin.disabled = false;
          return;
        }

        // Calcular SHA-256 da senha
        const hashSenha = await calcularSHA256(senha);

        // Buscar usuário no banco por email (aluno ou professor)
        const usuarios = await sbGet("usuario", `email=eq.${encodeURIComponent(email)}&select=*`);

        if (!usuarios || usuarios.length === 0) {
          mostrarMsg("Email ou senha incorretos", true);
          btnLogin.disabled = false;
          return;
        }

        const usuarioBD = usuarios[0];

        // Validar senha
        if (usuarioBD.senha_hash !== hashSenha) {
          mostrarMsg("Email ou senha incorretos", true);
          btnLogin.disabled = false;
          return;
        }

        // Salvar dados de sessão em sessionStorage (válido para aluno ou professor)
        sessionStorage.setItem("usuarioId", usuarioBD.id);
        sessionStorage.setItem("usuarioLogin", usuarioBD.login_usuario);
        sessionStorage.setItem("usuarioPerfil", usuarioBD.perfil); // ALUNO ou PROFESSOR
        sessionStorage.setItem("usuarioNome", usuarioBD.nome_completo || usuarioBD.login_usuario);
        sessionStorage.setItem("usuarioEmail", email);
        sessionStorage.setItem("usuarioTimestamp", Date.now());

        mostrarMsg("✅ Login realizado com sucesso!", false);
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } catch (erro) {
        console.error("❌ Erro ao fazer login:", erro);
        mostrarMsg("❌ Erro: " + erro.message, true);
        btnLogin.disabled = false;
      }
    }

    function mostrarMsg(msg, erro) {
      const msgEl = document.getElementById("loginMsg");
      msgEl.textContent = msg;
      msgEl.className = "msg " + (erro ? "error" : "success");
      msgEl.style.display = "block";
    }

    async function calcularSHA256(texto) {
      const encoder = new TextEncoder();
      const dados = encoder.encode(texto);
      const hashBuffer = await crypto.subtle.digest("SHA-256", dados);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      return hashHex;
    }
  </script>
</body>
</html>
